name: Temporary Reliability Patch Smoke Test

on:
  push:
    paths:
      - '.github/workflows/temp_reliability_smoke.yml'
  workflow_run:
    workflows: ["Update WPC Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/actions-reliability-20261003
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install LightningCast self-test dependency
        run: python -m pip install 'Pillow>=10,<13'

      - name: Compile modified Python scripts
        run: |
          python -m py_compile fetch_cam_ero.py
          python -m py_compile fetch_hrrr_tle.py
          python -m py_compile fetch_lightningcast.py

      - name: Run LightningCast self-test
        run: python fetch_lightningcast.py --self-test

      - name: Verify deleted generated files are staged by quoted Git pathspec
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/git_pathspec_test"
          rm -rf "${root}"
          mkdir -p "${root}/static"
          cd "${root}"
          git init -q
          git config user.email test@example.invalid
          git config user.name test
          printf 'old\n' > static/cam_old.png
          printf '{}\n' > static/cam_metadata.json
          git add static
          git commit -qm baseline
          rm static/cam_old.png
          printf '{"new":true}\n' > static/cam_metadata.json
          git add -A -- 'static/cam_*.png' static/cam_metadata.json
          git diff --cached --name-status > staged.txt
          cat staged.txt
          grep -q $'^D\\tstatic/cam_old.png$' staged.txt
          grep -q $'^M\\tstatic/cam_metadata.json$' staged.txt

      - name: Record smoke result on reliability branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "${JOB_STATUS}" == "success" ]]; then
            result="PASS"
          else
            result="FAIL"
          fi
          printf '%s %s\n' "${result}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > reliability_smoke_result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reliability_smoke_result.txt
          git commit -m "Record reliability smoke-test ${result,,}"
          git push origin HEAD:fix/actions-reliability-20261003
