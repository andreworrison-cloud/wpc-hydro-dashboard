name: Update RAP Mesoanalysis

on:
  # Strictly listens for the dedicated ping from cron-job.org.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rap-operational
  cancel-in-progress: false

jobs:
  rap-gdi:
    # Receives the existing cron-job.org RAP trigger; runs independently.
    uses: ./.github/workflows/publish_rap_gdi.yml
    permissions:
      contents: write

  update-rap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ecCodes)
        run: |
          # Google Chrome is preconfigured on GitHub-hosted runners but is not
          # required by this RAP workflow. Disable its apt source so transient
          # Chrome repository metadata-sync errors cannot block RAP updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list

          # Clear runner package-list state, retry transient mirror failures,
          # and install only the ecCodes system library we actually need.
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libeccodes0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests xarray cfgrib matplotlib numpy scipy metpy eccodes

      - name: Restore current RAP dashboard snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path 'static/rap_*' \
            --path 'static/leg_*.png'
      - name: Run RAP Mesoanalysis Script
        run: python fetch_rap.py

      - name: Validate coherent RAP package
        run: python tools/validate_model_package.py rap

      - name: Publish RAP maps to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Auto-update hourly RAP maps" \
            --path 'static/rap_*' \
            --path 'static/leg_*.png'