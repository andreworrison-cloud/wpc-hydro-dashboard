name: Update RAP Mesoanalysis

on:
  # Strictly listens for the dedicated ping from cron-job.org.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rap-operational
  cancel-in-progress: false

jobs:
  surface-analysis:
    # Shares the existing hourly cron-job.org dispatch; independent of RAP failures.
    uses: ./.github/workflows/update_surface_analysis.yml
    permissions:
      contents: write

  rap-gdi:
    # Receives the existing cron-job.org RAP trigger; runs independently.
    uses: ./.github/workflows/publish_rap_gdi.yml
    permissions:
      contents: write

  update-rap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -c constraints-grib.txt requests xarray cfgrib matplotlib numpy scipy metpy eccodes eccodeslib
          python -m eccodes selfcheck

      - name: Restore current RAP dashboard snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path 'static/rap_*' \
            --path 'static/leg_*.png'
      - name: Run RAP Mesoanalysis Script
        run: python fetch_rap.py

      - name: Validate coherent RAP package
        run: python tools/validate_model_package.py rap

      - name: Publish RAP maps to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Auto-update hourly RAP maps" \
            --path 'static/rap_*' \
            --path 'static/leg_*.png'