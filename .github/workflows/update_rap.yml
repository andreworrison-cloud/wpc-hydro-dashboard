name: Update RAP Mesoanalysis

on:
  # Strictly listens for the dedicated ping from cron-job.org.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rap-operational
  cancel-in-progress: false

jobs:
  update-rap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ecCodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests xarray cfgrib matplotlib numpy scipy metpy eccodes

      - name: Run RAP Mesoanalysis Script
        run: python fetch_rap.py

      - name: Commit and push RAP maps
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Preserve the existing behavior: stage only generated static outputs.
          git add static/

          if git diff --cached --quiet; then
            echo "RAP products are unchanged."
            exit 0
          fi

          git commit -m "Auto-update hourly RAP maps"

          for attempt in 1 2 3; do
            echo "Sync/push attempt ${attempt}..."

            if ! git pull --rebase origin "${BRANCH_NAME}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "RAP products committed successfully."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Unable to push RAP products after three attempts."
          exit 1
