name: Fetch SPoRT-LIS Soil Percentiles

on:
  schedule:
    # Runs at 15 past the hour, on cycles 01, 07, 13, and 19 UTC
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch: 

jobs:
  update-sport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SPoRT Script
        run: python fetch_sport.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/sport_soil_percentile.png static/sport_metadata.json
          git commit -m "Automated update: SPoRT-LIS percentiles" || echo "No changes to commit"
          git push
