name: Fetch SPoRT-LIS Soil Percentiles

on:
  schedule:
    # Runs at 15 past the hour on cycles 01, 07, 13, and 19 UTC.
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sport-lis-soil-percentiles
  cancel-in-progress: false

jobs:
  update-sport:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SPoRT script
        run: python fetch_sport.py

      - name: Commit and push changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/sport_soil_percentile.png static/sport_metadata.json

          if git diff --cached --quiet; then
            echo "SPoRT-LIS products are unchanged."
            exit 0
          fi

          git commit -m "Automated update: SPoRT-LIS percentiles"

          for attempt in 1 2 3; do
            echo "Sync/push attempt ${attempt}..."

            if ! git pull --rebase origin "${BRANCH_NAME}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "SPoRT-LIS products committed successfully."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Unable to push SPoRT-LIS products after three attempts."
          exit 1
