name: Update WPC Data

on:
  # Triggered remotely by cron-job.org every 5 minutes.
  workflow_dispatch:

permissions:
  contents: write

# Do not interrupt an active update. If more than one newer dispatch is waiting,
# GitHub keeps only the newest pending run for this real-time workflow.
concurrency:
  group: update-wpc-data-operational
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas requests

      - name: Run WPC Fetch Script
        run: python fetch_wpc.py

      - name: Run FFD Contour Fetch Script
        run: python fetch_ffd.py

      - name: Commit and push changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add wpc_data.geojson static/ffd_contours.txt

          if git diff --cached --quiet; then
            echo "WPC and FFD real-time products are unchanged."
            exit 0
          fi

          git commit -m "Auto-update WPC and FFD real-time data"

          for attempt in 1 2 3; do
            echo "Sync/push attempt ${attempt}..."

            if ! git pull --rebase origin "${BRANCH_NAME}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "WPC and FFD products committed successfully."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Unable to push WPC and FFD products after three attempts."
          exit 1
