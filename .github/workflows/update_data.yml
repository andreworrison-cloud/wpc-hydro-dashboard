name: Update WPC Data

on:
  # Triggered remotely by cron-job.org every 5 minutes.
  workflow_dispatch:

permissions:
  contents: write

# Do not interrupt an active update. If more than one newer dispatch is waiting,
# GitHub keeps only the newest pending run for this real-time workflow.
concurrency:
  group: update-wpc-data-operational
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas requests

      - name: Restore current WPC and FFD dashboard snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path wpc_data.geojson \
            --path static/ffd_contours.txt
      - name: Run WPC Fetch Script
        run: python fetch_wpc.py

      - name: Run FFD Contour Fetch Script
        run: python fetch_ffd.py

      - name: Publish WPC and FFD products to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Auto-update WPC and FFD real-time data" \
            --path wpc_data.geojson \
            --path static/ffd_contours.txt