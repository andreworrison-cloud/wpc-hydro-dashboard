name: Fetch NLDAS-2 Soil Moisture

on:
  schedule:
    # Runs once a day at 14:00 UTC (morning in the US) to grab the latest daily data
    - cron: '0 14 * * *'
  workflow_dispatch: # Gives you a button in GitHub to run it manually anytime

jobs:
  update-nldas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # This points directly to the requirements.txt file you just put in the root folder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NLDAS-2 Script
        # Adjust the path here if you saved fetch_nldas3.py inside the static/ folder 
        # (e.g., python static/fetch_nldas2.py)
        run: python fetch_nldas2.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/nldas_soil_moisture.png static/nldas_metadata.json
          git commit -m "Automated update: NLDAS-2 soil moisture" || echo "No changes to commit"
          git push
