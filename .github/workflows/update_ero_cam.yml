name: Update Day 1 ERO CAMs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ero-cam-operational
  cancel-in-progress: false

jobs:
  update-ero-cams:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Refresh queued run to latest branch head
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners currently include the Google Chrome
          # apt repository. The Day 1 ERO CAM workflow does not use Chrome, so
          # disable that unrelated repository before apt metadata refreshes.
          # This prevents transient Chrome Packages/Release hash mismatches
          # from blocking the meteorological workflow.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "${source_file}" ] && sudo grep -q "dl.google.com/linux/chrome-stable/deb" "${source_file}" 2>/dev/null; then
              echo "Disabling unused Google Chrome apt source: ${source_file}"
              sudo rm -f "${source_file}"
            fi
          done

          # Drop cached package-list metadata so the remaining repositories
          # are refreshed as one internally consistent snapshot.
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libeccodes0

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy xarray cfgrib matplotlib

      - name: Restore current Day 1 ERO CAM snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path 'static/ero_*.png' \
            --path static/ero_cam_metadata.json
      - name: Run ERO CAM Fetch Script
        run: python fetch_cam_ero.py

      - name: Publish Day 1 ERO CAM products to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Automated Day 1 ERO CAM Update" \
            --path 'static/ero_*.png' \
            --path static/ero_cam_metadata.json