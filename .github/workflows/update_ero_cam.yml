name: Update Day 1 ERO CAMs

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  update-ero-cams:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy xarray cfgrib matplotlib

      - name: Run ERO CAM Fetch Script
        run: python fetch_cam_ero.py

      - name: Commit and Push Generated PNGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/ero_*.png static/ero_cam_metadata.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated Day 1 ERO CAM Update"
          git pull --rebase origin main
          git push
