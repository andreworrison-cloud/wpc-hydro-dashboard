name: Update Day 1 ERO CAMs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ero-cam-operational
  cancel-in-progress: false

jobs:
  update-ero-cams:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy xarray cfgrib matplotlib

      - name: Run ERO CAM Fetch Script
        run: python fetch_cam_ero.py

      - name: Commit and push generated PNGs
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add static/ero_*.png static/ero_cam_metadata.json

          if git diff --cached --quiet; then
            echo "Day 1 ERO CAM products are unchanged."
            exit 0
          fi

          git commit -m "Automated Day 1 ERO CAM Update"

          for attempt in 1 2 3; do
            echo "Sync/push attempt ${attempt}..."

            if ! git pull --rebase origin "${BRANCH_NAME}"; then
              git rebase --abort || true
              sleep $((attempt * 10))
              continue
            fi

            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "Day 1 ERO CAM products committed successfully."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Unable to push Day 1 ERO CAM products after three attempts."
          exit 1
