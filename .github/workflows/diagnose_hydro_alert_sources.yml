name: Diagnose Hydro Alert Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_hydro_alert_sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare CAP lifecycle IDs with GIS polygon URLs
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from collections import Counter,defaultdict
          EVENTS={'Flash Flood Warning','Flood Warning','Flood Advisory','Flood Watch','Flash Flood Watch'}
          H={'User-Agent':'WPC-Hydro-Dashboard-Diagnostic/1.0'}
          cap=requests.get('https://api.weather.gov/alerts/active',headers=H,timeout=30).json()
          c=[f for f in cap.get('features',[]) if (f.get('properties') or {}).get('event') in EVENTS]
          where="prod_type IN ('Flash Flood Warning','Flood Warning','Flood Advisory','Flood Watch','Flash Flood Watch')"
          url='https://mapservices.weather.noaa.gov/eventdriven/rest/services/WWA/watch_warn_adv/MapServer/1/query'
          gis=requests.get(url,params={'where':where,'outFields':'prod_type,wfo,expiration,url','returnGeometry':'true','f':'geojson','t':'id-compare'},headers=H,timeout=30).json()
          g=[f for f in gis.get('features',[]) if f.get('geometry')]
          cap_by=defaultdict(set); gis_by=defaultdict(set)
          for f in c:
              p=f.get('properties') or {}
              cap_by[p.get('event')].add(str(f.get('id') or '').rstrip('/'))
          for f in g:
              p=f.get('properties') or {}
              gis_by[p.get('prod_type')].add(str(p.get('url') or '').rstrip('/'))
          for event in sorted(EVENTS):
              missing=sorted(cap_by[event]-gis_by[event])
              extra=sorted(gis_by[event]-cap_by[event])
              print(event,'CAP alerts',len(cap_by[event]),'GIS unique URLs',len(gis_by[event]),'GIS polygons',sum(1 for f in g if (f.get('properties') or {}).get('prod_type')==event))
              print('  missing CAP URLs in GIS',len(missing),missing[:5])
              print('  extra GIS URLs vs CAP',len(extra),extra[:5])
          PY
