name: Diagnose Hydro Alert Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_hydro_alert_sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test exact dashboard hydro request and browser headers
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from collections import Counter
          where="prod_type IN ('Flash Flood Warning','Flood Warning','Flood Advisory','Flood Watch','Flash Flood Watch')"
          base='https://mapservices.weather.noaa.gov/eventdriven/rest/services/WWA/watch_warn_adv/MapServer/1/query'
          params={'where':where,'outFields':'prod_type,wfo,expiration,url','f':'geojson','t':'diagnostic'}
          r=requests.get(base,params=params,headers={'User-Agent':'Mozilla/5.0','Origin':'https://andreworrison-cloud.github.io'},timeout=30)
          print('HTTP',r.status_code,r.url)
          print('content-type',r.headers.get('content-type'))
          print('access-control-allow-origin',r.headers.get('access-control-allow-origin'))
          print('cache-control',r.headers.get('cache-control'))
          print('age',r.headers.get('age'))
          print('via',r.headers.get('via'))
          r.raise_for_status()
          data=r.json()
          feats=data.get('features',[])
          valid=[f for f in feats if f.get('geometry') and (f.get('properties') or {}).get('prod_type')]
          nullgeom=[f for f in feats if not f.get('geometry')]
          print('raw',len(feats),'valid geometry',len(valid),'null geometry',len(nullgeom),'exceeded',data.get('exceededTransferLimit'))
          print('counts',dict(sorted(Counter((f.get('properties') or {}).get('prod_type') for f in valid).items())))
          if feats:
              print('first geometry type', (feats[0].get('geometry') or {}).get('type'))
              print('first props',feats[0].get('properties'))

          opt=requests.options(base,headers={
              'Origin':'https://andreworrison-cloud.github.io',
              'Access-Control-Request-Method':'GET',
              'Access-Control-Request-Headers':'cache-control'
          },timeout=30)
          print('OPTIONS',opt.status_code)
          print('OPTIONS allow-origin',opt.headers.get('access-control-allow-origin'))
          print('OPTIONS allow-methods',opt.headers.get('access-control-allow-methods'))
          print('OPTIONS allow-headers',opt.headers.get('access-control-allow-headers'))
          PY
