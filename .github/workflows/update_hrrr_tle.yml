name: Update HRRR-TLE Flash Flood Guidance

on:
  push:
    branches: [main]
    paths:
      - 'fetch_hrrr_tle.py'
      - 'flash_flood_suite.py'
      - 'cam_member_io.py'
      - '.github/workflows/update_hrrr_tle.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if the newest complete HRRR-TLE cycle is already published'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-hrrr-tle
  cancel-in-progress: false

jobs:
  update-hrrr-tle:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh queued run to latest branch head
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy scipy requests xarray cfgrib eccodes \
            matplotlib cartopy pillow

      - name: Verify GRIB decoder
        run: |
          python -m eccodes selfcheck
          python -m cfgrib selfcheck

      # Model/FFG downloads are temporary runner files. Do not retain hourly
      # copies of raw GRIB or decoded rainfall in Actions caches or artifacts.

      - name: Restore current HRRR / HRRR-TLE dashboard snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path static/hrrr_latest_12h_max_ffg_ratio.png \
            --path static/hrrr_latest_12h_ffg_exceedance_coverage.png \
            --path 'static/hrrr_tle_*'
      - name: Build newest complete HRRR / HRRR-TLE package
        shell: bash
        run: |
          set -euo pipefail
          force_arg=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            force_arg="--force"
          fi
          python fetch_hrrr_tle.py --output-dir static ${force_arg}

      - name: Validate generated package when present
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("static")
          manifest_path = root / "hrrr_tle_manifest.json"
          if not manifest_path.exists():
              raise SystemExit("No HRRR-TLE manifest exists after build.")

          manifest = json.loads(manifest_path.read_text())
          if manifest.get("metadata_mode") != "hrrr_tle_dashboard_manifest_v1":
              raise SystemExit("Unexpected HRRR-TLE manifest contract.")

          layers = manifest.get("layers") or {}
          if len(layers) != 20:
              raise SystemExit(
                  f"Expected 20 synchronized overlays (2 HRRR diagnostics + 18 HRRR-TLE), "
                  f"found {len(layers)}."
              )

          expected_size = (6000, 3594)
          declared_size = (
              int(manifest.get("render_width_px", -1)),
              int(manifest.get("render_height_px", -1)),
          )
          if declared_size != expected_size:
              raise SystemExit(
                  f"Unexpected HRRR/HRRR-TLE render contract {declared_size}; "
                  f"expected {expected_size}."
              )
          if int(manifest.get("render_dpi", -1)) != 600:
              raise SystemExit(
                  f"Unexpected render DPI {manifest.get('render_dpi')}; expected 600."
              )

          for key, item in layers.items():
              p = root / item["file"]
              if not p.exists():
                  raise SystemExit(f"Missing overlay {key}: {p}")
              with Image.open(p) as image:
                  if image.size != expected_size:
                      raise SystemExit(
                          f"{key}: image size {image.size}; expected {expected_size}"
                      )
          print(
              f"Validated 20 HRRR/HRRR-TLE overlays at {expected_size[0]}x{expected_size[1]} "
              f"for TLE anchor {manifest['latest_cycle_utc']}."
          )
          PY

      - name: Validate HRRR / HRRR-TLE freshness contract
        run: python tools/validate_model_package.py hrrr-tle

      - name: Publish HRRR / HRRR-TLE products to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Update HRRR / HRRR-TLE flash flood guidance" \
            --path static/hrrr_latest_12h_max_ffg_ratio.png \
            --path static/hrrr_latest_12h_ffg_exceedance_coverage.png \
            --path 'static/hrrr_tle_*'

  update-rrfs-blend:
    name: Update ${{ matrix.suite }} Flash Flood Guidance
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [rrfs, hrrr_rrfs]
    steps:
      - name: Checkout current source
        uses: actions/checkout@v6
      - name: Refresh queued run to latest source
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install shared science and operational GRIB decoder
        run: |
          python -m pip install numpy scipy requests xarray cfgrib eccodes matplotlib cartopy pillow rasterio pyproj
          python tools/test_flash_flood.py
          node tools/test_flash_flood_display.cjs
          python -m eccodes selfcheck
      - name: Restore this suite's latest complete live package
        run: |
          python tools/publish_pages_snapshot.py restore --branch pages-live --path 'static/${{ matrix.suite }}_*'
      - name: Build complete operational RRFS or HRRR/RRFS suite
        env:
          SUITE: ${{ matrix.suite }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail
          force_arg=""
          if [[ "$FORCE_BUILD" == "true" ]]; then force_arg="--force"; fi
          python flash_flood_suite.py --suite "$SUITE" --output-dir static ${force_arg}
      - name: Validate all source hours, hashes, render geometry and freshness
        run: python flash_flood_suite.py --suite '${{ matrix.suite }}' --output-dir static --validate-only
      - name: Publish current maps without retaining raster history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish --branch pages-live             --message 'Update ${{ matrix.suite }} flash flood guidance' --path 'static/${{ matrix.suite }}_*'
