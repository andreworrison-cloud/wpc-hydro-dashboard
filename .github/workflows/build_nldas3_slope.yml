name: Build NLDAS-3 static terrain slope

on:
  push:
    branches:
      - feature/nldas3-static-slope-diagnostic
    paths:
      - tools/build_nldas3_slope.py
      - .github/workflows/build_nldas3_slope.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" xarray h5netcdf h5py s3fs rasterio pillow

      - name: Build descriptive CONUS percent-slope layer
        run: |
          python tools/build_nldas3_slope.py

      - name: Upload slope display candidate
        uses: actions/upload-artifact@v4
        with:
          name: nldas3-slope-display-candidate
          path: nldas3_slope_build/
          if-no-files-found: error
          retention-days: 14
