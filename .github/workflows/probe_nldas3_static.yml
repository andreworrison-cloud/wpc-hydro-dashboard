name: Probe NLDAS-3 static sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" xarray h5netcdf h5py s3fs

      - name: Inspect NASA NLDAS-3 static NetCDF sources
        run: |
          python tools/probe_nldas3_static.py

      - name: Upload schema inventory
        uses: actions/upload-artifact@v4
        with:
          name: nldas3-static-inventory
          path: diagnostics/nldas3_static_inventory.json
          if-no-files-found: error
          retention-days: 14
