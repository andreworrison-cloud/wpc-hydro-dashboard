name: Validate RFC FFG Ingest
# No production cron or publication until the reviewed displays are integrated.
# Proposed operational cadence: minute 50 each hour, after observed WPC posting.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fetch_rfc_ffg.py'
      - 'tools/rfc_ffg_display.js'
      - 'tools/test_rfc_ffg_display.cjs'
      - 'tools/build_rfc_ffg_review.py'
      - 'tools/rfc_ffg_review_template.html'
      - 'tools/test_fetch_rfc_ffg.py'
      - 'tools/rfc_ffg_coverage_baseline.json'
      - 'tools/probe_rfc_ffg_numeric.py'
      - 'tools/probe_rfc_ffg.py'
      - '.github/workflows/update_rfc_ffg.yml'
permissions:
  contents: read
concurrency:
  group: rfc-ffg-ingest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install "numpy>=2,<3" "rasterio>=1.4,<2"
      - name: Validate failure and publication contracts
        run: |
          python -m unittest discover -s tools -p 'test_probe_rfc_ffg*.py' -v
          python -m unittest discover -s tools -p 'test_fetch_rfc_ffg.py' -v
      - name: Test browser freshness contract
        run: node tools/test_rfc_ffg_display.cjs
      - name: Restore last validated rehearsal state
        uses: actions/cache/restore@v4
        with:
          path: diagnostics/rfc_ffg_ingest
          key: rfc-ffg-ingest-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rfc-ffg-ingest-v1-${{ github.ref }}-
      - name: Ingest latest hourly WPC product
        id: ingest
        run: python fetch_rfc_ffg.py --output-dir diagnostics/rfc_ffg_ingest/public --science-dir diagnostics/rfc_ffg_ingest/science
      - name: Build offline display review
        if: always() && steps.ingest.outcome == 'success'
        run: python tools/build_rfc_ffg_review.py --public-dir diagnostics/rfc_ffg_ingest/public --output diagnostics/rfc_ffg_ingest/rfc_ffg_review.html
      - name: Save validated fields and explicit failure status
        if: always() && steps.ingest.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: diagnostics/rfc_ffg_ingest
          key: rfc-ffg-ingest-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reviewable product and scientific provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc-ffg-ingest-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/rfc_ffg_ingest/
          if-no-files-found: warn
          retention-days: 14
