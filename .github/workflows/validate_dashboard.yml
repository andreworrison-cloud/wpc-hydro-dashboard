name: Validate Dashboard Interface

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tools/validate_dashboard.py'
      - 'fetch_hrrr_tle.py'
      - '.github/workflows/update_hrrr_tle.yml'
      - '.github/workflows/validate_dashboard.yml'
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tools/validate_dashboard.py'
      - 'fetch_hrrr_tle.py'
      - '.github/workflows/update_hrrr_tle.yml'
      - '.github/workflows/validate_dashboard.yml'

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate menu order and required layers
        run: python tools/validate_dashboard.py
