name: Validate Dashboard Interface

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'surface_layer.js'
      - 'surface_cartography.js'
      - 'surface_analysis.py'
      - 'surface_contours.py'
      - 'surface_sampling.py'
      - 'surface_sampling.js'
      - 'fetch_surface_analysis.py'
      - 'tools/test_surface*'
      - '.github/workflows/update_surface_analysis.yml'
      - 'app.js'
      - 'gdi_layer.js'
      - 'gdi_suite_layer.js'
      - 'gdi_dynamics_layer.js'
      - 'tools/test_gdi_dynamics.cjs'
      - 'tools/publish_gdi_suite.py'
      - '.github/workflows/publish_gdi.yml'
      - '.github/workflows/publish_rap_gdi.yml'
      - '.github/workflows/publish_gdi_guidance.yml'
      - '.github/workflows/publish_gdi_product.yml'
      - '.github/workflows/publish_qpe_ffg.yml'
      - '.github/workflows/update_rap.yml'
      - '.github/workflows/update_cam.yml'
      - '.github/workflows/update_ero_cam.yml'
      - 'fetch_rap.py'
      - 'fetch_nwm.py'
      - '.github/workflows/fetch_nwm.yml'
      - 'tools/validate_model_package.py'
      - 'tools/publish_pages_snapshot.py'
      - 'tools/gdi/**'
      - 'tools/publish_gdi.py'
      - 'index.html'
      - 'style.css'
      - 'tools/validate_dashboard.py'
      - 'fetch_glm_mosaic.py'
      - '.github/workflows/update_glm_mosaic.yml'
      - 'fetch_lightningcast.py'
      - '.github/workflows/update_lightningcast.yml'
      - 'fetch_hrrr_tle.py'
      - 'fetch_cam.py'
      - 'fetch_cam_ero.py'
      - '.github/workflows/update_hrrr_tle.yml'
      - 'fetch_mrms_rala.py'
      - 'fetch_mrms_rala_loop.py'
      - 'fetch_mrms_winter_type.py'
      - 'winter_precip.py'
      - 'winter_precip_display.js'
      - 'tools/test_winter_precip*'
      - 'tools/validate_mrms_rala.py'
      - 'tools/validate_mrms_rala_loop.py'
      - '.github/workflows/update_mrms_rala.yml'
      - '.github/workflows/validate_dashboard.yml'
  push:
    paths:
      - 'surface_layer.js'
      - 'surface_cartography.js'
      - 'surface_analysis.py'
      - 'surface_contours.py'
      - 'surface_sampling.py'
      - 'surface_sampling.js'
      - 'fetch_surface_analysis.py'
      - 'tools/test_surface*'
      - '.github/workflows/update_surface_analysis.yml'
      - 'app.js'
      - 'gdi_layer.js'
      - 'gdi_suite_layer.js'
      - 'gdi_dynamics_layer.js'
      - 'tools/test_gdi_dynamics.cjs'
      - 'tools/publish_gdi_suite.py'
      - '.github/workflows/publish_gdi.yml'
      - '.github/workflows/publish_rap_gdi.yml'
      - '.github/workflows/publish_gdi_guidance.yml'
      - '.github/workflows/publish_gdi_product.yml'
      - '.github/workflows/publish_qpe_ffg.yml'
      - '.github/workflows/update_rap.yml'
      - '.github/workflows/update_cam.yml'
      - '.github/workflows/update_ero_cam.yml'
      - 'fetch_rap.py'
      - 'fetch_nwm.py'
      - '.github/workflows/fetch_nwm.yml'
      - 'tools/validate_model_package.py'
      - 'tools/publish_pages_snapshot.py'
      - 'tools/gdi/**'
      - 'tools/publish_gdi.py'
      - 'index.html'
      - 'style.css'
      - 'tools/validate_dashboard.py'
      - 'fetch_glm_mosaic.py'
      - '.github/workflows/update_glm_mosaic.yml'
      - 'fetch_lightningcast.py'
      - '.github/workflows/update_lightningcast.yml'
      - 'fetch_hrrr_tle.py'
      - 'fetch_cam.py'
      - 'fetch_cam_ero.py'
      - '.github/workflows/update_hrrr_tle.yml'
      - 'fetch_mrms_rala.py'
      - 'fetch_mrms_rala_loop.py'
      - 'fetch_mrms_winter_type.py'
      - 'winter_precip.py'
      - 'winter_precip_display.js'
      - 'tools/test_winter_precip*'
      - 'tools/validate_mrms_rala.py'
      - 'tools/validate_mrms_rala_loop.py'
      - '.github/workflows/update_mrms_rala.yml'
      - '.github/workflows/validate_dashboard.yml'

permissions:
  contents: read

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check JavaScript syntax
        run: |
          node --check surface_layer.js
          node --check surface_cartography.js
          node --check surface_sampling.js
          node --check app.js
          node --check gdi_layer.js
          node --check gdi_suite_layer.js
          node --check gdi_dynamics_layer.js
          node tools/test_gdi_dynamics.cjs
          node --check gdi_display.js
          node tools/test_gdi_display.cjs
          node tools/gdi/test_adapter.cjs
          node --check winter_precip_display.js
          node tools/test_radar_playback.cjs

      - name: Check MRMS RALA Python syntax
        run: python -m py_compile fetch_mrms_rala.py fetch_mrms_rala_loop.py tools/validate_mrms_rala.py tools/validate_mrms_rala_loop.py

      - name: Check GDI valid-time alignment and aggregation
        run: |
          pip install numpy scipy eccodes rasterio pyproj requests pillow contourpy matplotlib
          python tools/gdi/test_guidance.py
          python tools/gdi/test_dynamics.py
          python tools/gdi/test_forecast_dynamics.py
          python tools/test_surface_analysis.py
          python tools/test_surface_contours.py
          python tools/test_surface_sampling.py
          node tools/test_surface_cartography.cjs
          node tools/test_surface_sampling.cjs
          node tools/test_surface_layer.cjs
          python tools/test_winter_precip.py
          python tools/test_winter_precip_sources.py
          node tools/test_winter_precip_display.cjs

      - name: Check stable GDI legend controls
        env:
          GDI_TEST_DOM_MODULE: ${{ runner.temp }}/gdi-dom-test/node_modules/jsdom
        run: |
          npm install --prefix "$RUNNER_TEMP/gdi-dom-test" --no-audit --no-fund --no-save jsdom@26.1.0
          node tools/test_gdi_legend.cjs
          node tools/test_winter_precip_dom.cjs

      - name: Check model-data Python syntax
        run: |
          python -m py_compile \
            fetch_cam.py \
            fetch_cam_ero.py \
            fetch_rap.py \
            fetch_hrrr_tle.py \
            fetch_nwm.py \
            tools/validate_model_package.py \
            tools/publish_pages_snapshot.py \
            tools/publish_gdi.py \
            tools/publish_gdi_suite.py

      - name: Validate model runtime ownership guard
        run: |
          python - <<'PY'
          from tools.publish_pages_snapshot import is_model_runtime_owned

          for path in (
              'static/cam_metadata.json',
              'static/ero_cam_metadata.json',
              'static/rap_metadata.json',
              'static/hrrr_tle_manifest.json',
              'static/nwm_metadata.json',
              'static/leg_pwat.png',
          ):
              assert is_model_runtime_owned(path), path

          for path in ('app.js', 'style.css', 'fetch_rap.py', 'static/nldas3_static_metadata.json'):
              assert not is_model_runtime_owned(path), path

          print('Model runtime ownership guard PASS')
          PY

      - name: Validate menu order and required layers
        run: python tools/validate_dashboard.py
