name: Fetch NLDAS-2 Noah Relative Soil Moisture

on:
  # Retired from the dashboard; retain manual execution for reproducibility.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nldas-rsm-update
  cancel-in-progress: false

jobs:
  update-nldas-rsm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            requests \
            numpy \
            xarray \
            h5netcdf \
            h5py \
            rasterio \
            pyproj \
            affine \
            Pillow \
            'eccodes==2.50.0' 'eccodeslib==2.50.0.33'
          python -m eccodes selfcheck

      - name: Restore current NLDAS-2 RSM snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path static/nldas_rsm_0_10cm.png \
            --path static/nldas_rsm_0_100cm.png \
            --path static/nldas_rsm_metadata.json
      - name: Generate NLDAS-2 RSM products
        run: python fetch_nldas_rsm.py

      - name: Upload RSM preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: nldas-rsm-preview
          path: |
            static/nldas_rsm_0_10cm.png
            static/nldas_rsm_0_100cm.png
            static/nldas_rsm_metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish NLDAS-2 RSM products to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Automated update: NLDAS-2 Noah RSM" \
            --path static/nldas_rsm_0_10cm.png \
            --path static/nldas_rsm_0_100cm.png \
            --path static/nldas_rsm_metadata.json