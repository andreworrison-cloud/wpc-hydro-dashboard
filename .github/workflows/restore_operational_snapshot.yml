name: One-time restore operational dashboard snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_operational_snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-operational-dashboard
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: andreworrison-cloud/wpc-hydro-dashboard-archive-20261021
      SOURCE_SHA: ab6bbff766d445268ee9e7ba5962b12ad0e8d837

    steps:
      - name: Check out clean operational repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch exact archived dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://github.com/${SOURCE_REPO}.git" "${RUNNER_TEMP}/archive"
          cd "${RUNNER_TEMP}/archive"
          actual="$(git rev-parse HEAD)"
          echo "Archived main HEAD: ${actual}"
          if [[ "${actual}" != "${SOURCE_SHA}" ]]; then
            echo "Archive main moved; fetching exact recovery SHA."
            git fetch --depth 1 origin "${SOURCE_SHA}"
            git checkout --detach "${SOURCE_SHA}"
          fi
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Restore archived snapshot except workflow files
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/archive"
          restore_workflow=".github/workflows/restore_operational_snapshot.yml"

          # Preserve this temporary workflow unchanged so the job token does not
          # attempt to create/update workflow files in its own push.
          cp "${restore_workflow}" "${RUNNER_TEMP}/restore_operational_snapshot.yml"

          # Replace the working tree while preserving only .git.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          mkdir -p .github/workflows
          cp "${RUNNER_TEMP}/restore_operational_snapshot.yml" "${restore_workflow}"

          # Copy the archived current snapshot, but defer archived workflow YAML
          # files to the GitHub connector, which has permission to write them.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "${archive}/" ./

          # Verify every non-workflow file byte-for-byte.
          (
            cd "${archive}"
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/workflows/*' \
              -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > "${RUNNER_TEMP}/source.sha256"

          (
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/workflows/*' \
              -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > "${RUNNER_TEMP}/target.sha256"

          diff -u "${RUNNER_TEMP}/source.sha256" "${RUNNER_TEMP}/target.sha256"

          source_count="$(wc -l < "${RUNNER_TEMP}/source.sha256")"
          target_count="$(wc -l < "${RUNNER_TEMP}/target.sha256")"
          echo "Verified non-workflow file manifest: ${target_count} files"
          test "${source_count}" = "${target_count}"

      - name: Commit restored operational snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No non-workflow changes detected; snapshot already restored."
            exit 0
          fi

          git commit -m "Restore operational dashboard snapshot from archive ${SOURCE_SHA}"
          git push origin HEAD:main

      - name: Final status
        shell: bash
        run: |
          echo "Operational dashboard non-workflow snapshot restored from ${SOURCE_REPO}@${SOURCE_SHA}."
          echo "Archived workflow YAML files are restored separately through the GitHub connector."
          echo "The archived repository history was not imported."
