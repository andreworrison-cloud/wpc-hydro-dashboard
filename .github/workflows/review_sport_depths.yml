name: Review SPoRT-LIS Four Depths
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fetch_sport.py'
      - 'tools/sport_suite.py'
      - 'tools/test_sport_suite.py'
      - 'tools/build_sport_depth_review.py'
      - '.github/workflows/review_sport_depths.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'rasterio>=1.4,<2' requests pillow
      - name: Check whole-suite retention and expiry
        run: python -m unittest tools.test_sport_suite -v
      - name: Retrieve and validate four current numerical fields
        run: python fetch_sport.py --suite-dir diagnostics/sport-suite
      - name: Preserve review evidence and original floats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sport-four-depths-${{ github.run_id }}
          path: diagnostics/sport-suite
          retention-days: 14
