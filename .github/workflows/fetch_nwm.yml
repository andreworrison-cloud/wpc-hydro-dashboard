name: Fetch Hourly NWM Soil Moisture

on:
  schedule:
    # Runs hourly at half-past the hour
    - cron: '30 * * * *'
  workflow_dispatch: 

jobs:
  update-nwm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NWM Script
        run: python fetch_nwm.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/nwm_soil_saturation.png static/nwm_metadata.json
          git commit -m "Automated update: NWM Hourly soil saturation" || echo "No changes to commit"
          git push
