name: Sync Durable Source to Pages Live

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-live-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out durable source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          fetch-tags: false

      - name: Synchronize changed non-workflow paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python tools/publish_pages_snapshot.py sync-source \
            --branch pages-live \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA"
