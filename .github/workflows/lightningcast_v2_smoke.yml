name: LightningCast v2 Smoke Test

on:
  push:
    paths:
      - '.github/workflows/lightningcast_v2_smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'

      - name: Run LightningCast smoke test and preserve log
        shell: bash
        run: |
          set +e
          {
            echo "=== PY_COMPILE ==="
            python -m py_compile fetch_lightningcast.py
            echo "compile_status=$?"
            echo "=== SELF_TEST ==="
            python fetch_lightningcast.py --self-test
            echo "self_test_status=$?"
            echo "=== LIVE_BUILD ==="
            python fetch_lightningcast.py \
              --output-dir lightningcast_smoke_output \
              --maximum-age-minutes 20 \
              --maximum-frame-offset-minutes 5
            build_status=$?
            echo "build_status=$build_status"
            if [[ -f lightningcast_smoke_output/lightningcast_conus_probability_60min_metadata.json ]]; then
              echo "=== METADATA ==="
              cat lightningcast_smoke_output/lightningcast_conus_probability_60min_metadata.json
            fi
          } > lightningcast_v2_smoke.log 2>&1
          echo "${build_status:-99}" > lightningcast_v2_smoke.status
          exit 0

      - name: Commit smoke result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lightningcast_v2_smoke.log lightningcast_v2_smoke.status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "LightningCast v2 smoke result"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
