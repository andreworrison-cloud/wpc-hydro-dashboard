name: Clean Reviewed Legacy FFG Artifacts
# One-time, fixed-ID cleanup authorized after review on 4 November 2026.
# No timer and no age-based selection. Remove the push hook after verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup_reviewed_ffg_artifacts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-ffg-artifact-cleanup-20261104
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && github.repository == 'andreworrison-cloud/wpc-hydro-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test fixed scope and preflight failure protection
        run: python tools/test_reviewed_ffg_cleanup.py
      - name: Delete only the 335 reviewed legacy artifact IDs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/execute_reviewed_ffg_cleanup.py --execute-reviewed-plan --output reviewed-ffg-cleanup-result.json
      - name: Retain the compact cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-ffg-cleanup-receipt-${{ github.run_id }}
          path: reviewed-ffg-cleanup-result.json
          if-no-files-found: warn
          retention-days: 2
