name: Update CAM Nowcasts

# Runs automatically every hour at the 30-minute mark, and can be triggered manually
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  update-cams:
    runs-on: ubuntu-latest
    
    # Grants permission to commit the new images back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ecCodes for GRIB2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy xarray cfgrib matplotlib

      - name: Run CAM Fetch Script
        run: python cam_fetch.py

      - name: Commit and Push Generated PNGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/cam_*.png static/cam_metadata.json
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated CAM SuperEnsemble Update"
          git push
