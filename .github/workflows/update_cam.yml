name: Update CAM SuperEnsemble

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cam-operational
  cancel-in-progress: false

jobs:
  update-cams:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Refresh queued run to latest branch head
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners currently include the Google Chrome
          # apt repository. The CAM workflow does not use Chrome, so disable
          # that unrelated repository before apt metadata refreshes. This
          # prevents a transient Chrome Packages/Release hash mismatch from
          # blocking the meteorological workflow.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "${source_file}" ] && sudo grep -q "dl.google.com/linux/chrome-stable/deb" "${source_file}" 2>/dev/null; then
              echo "Disabling unused Google Chrome apt source: ${source_file}"
              sudo rm -f "${source_file}"
            fi
          done

          # Drop cached package-list metadata so the remaining repositories
          # are refreshed as one internally consistent snapshot.
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libeccodes0

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy xarray cfgrib matplotlib

      - name: Restore current CAM dashboard snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path 'static/cam_*.png' \
            --path static/cam_metadata.json
      - name: Run CAM Fetch Script
        run: python fetch_cam.py

      - name: Validate current or retained CAM package
        run: python tools/validate_model_package.py cam

      - name: Publish CAM SuperEnsemble products to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Automated CAM SuperEnsemble Update" \
            --path 'static/cam_*.png' \
            --path static/cam_metadata.json