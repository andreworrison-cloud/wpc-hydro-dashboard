name: Update CAM SuperEnsemble

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_cam.py
      - "cam_*.py"
      - cam_spc_members.json
      - .github/workflows/update_cam.yml

permissions:
  contents: write

concurrency:
  group: update-cam-operational
  cancel-in-progress: false

jobs:
  update-cams:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Refresh queued run to latest branch head
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "requests>=2.31,<3" "numpy>=1.24,<3" "scipy>=1.10,<2" "matplotlib>=3.7,<4" "cartopy>=0.22,<1" "rasterio>=1.3,<2" "pyproj>=3.5,<4" 'eccodes==2.50.0' 'eccodeslib==2.50.0.33'
          python -m eccodes selfcheck

      - name: Check ensemble science and official FFG cycle
        run: python tools/test_cam_probability.py

      - name: Identify current six-hour cache key
        id: native-cache-key
        shell: bash
        run: |
          python - <<'PY_CACHE'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          now = datetime.now(timezone.utc)
          key = now.replace(hour=now.hour//6*6).strftime('%Y%m%d%H')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('cycle=' + key + '\n')
          PY_CACHE

      - name: Restore validated native member checkpoints
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: grib_cache_cam_members
          key: cam-native-v2-cam-${{ steps.native-cache-key.outputs.cycle }}
          restore-keys: |
            cam-native-v2-cam-
            cam-native-v1-cam-

      - name: Restore current CAM dashboard snapshot
        run: |
          python tools/publish_pages_snapshot.py restore \
            --branch pages-live \
            --path 'static/cam_*.png' \
            --path static/cam_metadata.json \
            --path static/cam_sources.json
      - name: Run CAM Fetch Script
        run: python fetch_cam.py

      - name: Validate current or retained CAM package
        run: python tools/validate_model_package.py cam

      - name: Identify verified model cycle
        id: verified-cycle
        shell: bash
        run: |
          python - <<'PY_VERIFIED'
          import json, os
          from datetime import datetime
          from pathlib import Path
          meta = json.loads(Path('static/cam_metadata.json').read_text())
          init = datetime.fromisoformat(meta['spc_refs_init_utc'].replace('Z', '+00:00'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('cycle=' + init.strftime('%Y%m%d%H') + '\n')
              f.write('cache_key=cam-native-v2-cam-' + init.strftime('%Y%m%d%H') + '\n')
          PY_VERIFIED

      - name: Bound cache to this verified suite
        shell: bash
        run: |
          python tools/prune_cam_cache.py static/cam_sources.json grib_cache_cam_members

      - name: Save new native checkpoints once per model cycle
        if: steps.native-cache.outputs.cache-matched-key != steps.verified-cycle.outputs.cache_key
        uses: actions/cache/save@v5
        with:
          path: grib_cache_cam_members
          key: cam-native-v2-cam-${{ steps.verified-cycle.outputs.cycle }}

      - name: Publish CAM SuperEnsemble products to pages-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_pages_snapshot.py publish \
            --branch pages-live \
            --message "Automated CAM SuperEnsemble Update" \
            --path 'static/cam_*.png' \
            --path static/cam_metadata.json \
            --path static/cam_sources.json
