name: Update GOES GLM Mosaic

on:
  workflow_dispatch:
    inputs:
      analysis_time:
        description: Optional UTC end time; leave blank for newest synchronized radar-aligned data
        required: false
        default: ''
        type: string
      lookback_minutes:
        description: Minutes to search backward for a synchronized GOES-18/GOES-19 slot
        required: false
        default: '180'
        type: string
      minimum_completeness:
        description: Minimum required LCFA/cache completeness for both satellites and every window
        required: false
        default: '0.80'
        type: string
      maximum_latency_minutes:
        description: Maximum age allowed for automatically selected real-time data
        required: false
        default: '45'
        type: string
      publish_debug_layers:
        description: Manually generate separate satellite references, ownership, raw-event diagnostics, and radar HTML
        required: false
        default: false
        type: boolean
      upload_artifact:
        description: Upload the staging package for inspection; disabled for routine ten-minute production runs
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-goes-glm-mosaic
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GLM_OUTPUT_DIR: glm_operational_staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch only the current branch tip; full repository history is unnecessary.
          fetch-depth: 1
          fetch-tags: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          python -m pip install \
            --quiet \
            --no-input \
            --no-compile \
            --only-binary=:all: \
            boto3 \
            'numpy<3' \
            xarray \
            netCDF4 \
            rasterio \
            Pillow
          elapsed=$(( $(date +%s) - start ))
          printf 'dependency_install_seconds=%s\n' "$elapsed" >> "$RUNNER_TEMP/glm_workflow_timings.env"
          echo "Dependency installation completed in ${elapsed} seconds."

      - name: Validate generator syntax
        run: python -m py_compile fetch_glm_mosaic.py

      - name: Generate operational GLM mosaics
        env:
          ANALYSIS_TIME: ${{ inputs.analysis_time }}
          LOOKBACK_MINUTES: ${{ inputs.lookback_minutes }}
          MINIMUM_COMPLETENESS: ${{ inputs.minimum_completeness }}
          MAXIMUM_LATENCY_MINUTES: ${{ inputs.maximum_latency_minutes }}
          PUBLISH_DEBUG_LAYERS: ${{ inputs.publish_debug_layers }}
        shell: bash
        run: |
          set -euo pipefail
          # RUNNER_TEMP is a shell environment variable supplied by GitHub Actions.
          # Keep this cache local to the current runner; it is never restored or saved.
          cache_dir="${RUNNER_TEMP}/glm_mosaic_cache"
          rm -rf "$cache_dir"
          mkdir -p "$cache_dir"

          debug_flag='--no-publish-debug-layers'
          if [[ "${PUBLISH_DEBUG_LAYERS:-false}" == 'true' ]]; then
            debug_flag='--publish-debug-layers'
          fi

          python fetch_glm_mosaic.py \
            --analysis-time "${ANALYSIS_TIME:-}" \
            --lookback-minutes "${LOOKBACK_MINUTES:-180}" \
            --minimum-completeness "${MINIMUM_COMPLETENESS:-0.80}" \
            --maximum-latency-minutes "${MAXIMUM_LATENCY_MINUTES:-45}" \
            --cache-dir "$cache_dir" \
            --output-dir "$GLM_OUTPUT_DIR" \
            "$debug_flag"

      - name: Validate dashboard publication package
        env:
          MINIMUM_COMPLETENESS: ${{ inputs.minimum_completeness }}
          PUBLISH_DEBUG_LAYERS: ${{ inputs.publish_debug_layers }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from PIL import Image

          root = Path('glm_operational_staging')
          minimum = float(os.environ.get('MINIMUM_COMPLETENESS') or 0.80)
          debug = (os.environ.get('PUBLISH_DEBUG_LAYERS') or 'false').lower() == 'true'
          primary = ['glm_conus_mosaic_5min', 'glm_conus_mosaic_30min', 'glm_conus_mosaic_60min']
          expected = {
              'glm_mosaic_manifest.json',
              'glm_mosaic_summary.csv',
              'glm_convective_trend_15min_metadata.json',
          }
          for stem in primary:
              expected.update({f'{stem}.png', f'{stem}_metadata.json'})
          if debug:
              references = [
                  'glm_g18_fed_5min', 'glm_g18_fed_30min', 'glm_g18_fed_60min',
                  'glm_g19_fed_5min', 'glm_g19_fed_30min', 'glm_g19_fed_60min',
              ]
              for stem in references:
                  expected.update({f'{stem}.png', f'{stem}_metadata.json'})
              expected.update({
                  'glm_mosaic_source_ownership.png',
                  'glm_mosaic_source_ownership_metadata.json',
                  'glm_mosaic_incremental_debug.html',
                  'glm_g18_debug_event_density_5min.png',
                  'glm_g18_debug_footprint_5min.png',
                  'glm_g18_debug_event_sample_5min.geojson',
                  'glm_g18_debug_flash_centroids_5min.geojson',
                  'glm_g19_debug_event_density_5min.png',
                  'glm_g19_debug_footprint_5min.png',
                  'glm_g19_debug_event_sample_5min.geojson',
                  'glm_g19_debug_flash_centroids_5min.geojson',
              })

          missing = sorted(name for name in expected if not (root / name).is_file())
          if missing:
              raise SystemExit(f'Missing GLM files: {missing}')

          endings = set()
          for stem in primary:
              metadata = json.loads((root / f'{stem}_metadata.json').read_text())
              if metadata.get('metadata_mode') != 'glm_dashboard_v1' or metadata.get('product_role') != 'controlled_mosaic':
                  raise SystemExit(f'{stem}: dashboard metadata contract failed')
              method = metadata.get('mosaic_method') or {}
              if any(method.get(key) is not False for key in ('summation','averaging','blending','secondary_source_gap_fill')):
                  raise SystemExit(f'{stem}: controlled-mosaic safeguards failed')
              if str((metadata.get('grid') or {}).get('image_crs','')).upper() != 'EPSG:3857':
                  raise SystemExit(f'{stem}: invalid image CRS')
              for satellite in ('G18','G19'):
                  stats = (metadata.get('satellite_inputs') or {}).get(satellite) or {}
                  if float(stats.get('completeness_fraction',0)) < minimum:
                      raise SystemExit(f'{stem}: {satellite} completeness below threshold')
              endings.add(metadata['window_end_utc'])
              image = Image.open(root / f'{stem}.png').convert('RGBA')
              if image.width < 1000 or image.height < 500 or image.getchannel('A').getextrema()[1] == 0:
                  raise SystemExit(f'{stem}: empty or implausibly small PNG')
          if len(endings) != 1:
              raise SystemExit(f'Primary windows are not synchronized: {endings}')

          trend = json.loads((root / 'glm_convective_trend_15min_metadata.json').read_text())
          if trend.get('metadata_mode') != 'glm_dashboard_v1' or trend.get('product_role') != 'convective_trend_map':
              raise SystemExit('GLM trend-map metadata contract failed')
          if trend.get('window_end_utc') != next(iter(endings)):
              raise SystemExit('GLM trend-map and primary metadata ending times differ')
          rendering = trend.get('rendering') or {}
          expected_trend_labels = [
              'Past-Hour Lightning Context',
              'Rapidly Decreasing',
              'Decreasing',
              'Steady',
              'Increasing',
              'Rapidly Increasing',
          ]
          labels = rendering.get('labels') or []
          rgba = rendering.get('rgba') or []
          bins = rendering.get('bins') or []
          if labels != expected_trend_labels or len(rgba) != 6 or len(bins) != 6:
              raise SystemExit(
                  'GLM trend-map rendering contract failed: expected six categories '
                  'including Past-Hour Lightning Context'
              )
          import base64, io
          encoded = trend.get('embedded_png_base64') or ''
          try:
              trend_image = Image.open(io.BytesIO(base64.b64decode(encoded))).convert('RGBA')
          except Exception as error:
              raise SystemExit(f'GLM trend-map embedded PNG is invalid: {error}')
          if trend_image.width < 1000 or trend_image.height < 500:
              raise SystemExit('GLM trend-map embedded PNG is implausibly small')

          manifest = json.loads((root / 'glm_mosaic_manifest.json').read_text())
          if manifest.get('metadata_mode') != 'glm_dashboard_v1':
              raise SystemExit('Manifest metadata contract failed')
          if manifest.get('execution_mode') != ('full_diagnostics' if debug else 'operational_fast_path'):
              raise SystemExit('Manifest execution mode does not match workflow input')
          cache = manifest.get('incremental_cache') or {}
          if int(cache.get('retained_slot_count',0)) < 1:
              raise SystemExit('Run-local slot cache did not retain any synchronized slot')
          if manifest.get('window_end_utc') != next(iter(endings)):
              raise SystemExit('Manifest and primary metadata ending times differ')
          print(
              f"Validated {manifest['execution_mode']} package through {manifest['window_end_utc']}; "
              f"cache hits={cache.get('cache_hits_this_run')}, built={cache.get('new_slots_built_this_run')}."
          )
          PY

      - name: Upload requested GLM artifact
        if: ${{ inputs.upload_artifact || inputs.publish_debug_layers }}
        uses: actions/upload-artifact@v7
        with:
          name: goes-glm-mosaic-${{ github.run_id }}
          path: ${{ env.GLM_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish dashboard GLM files and push with retry
        env:
          PUBLISH_DEBUG_LAYERS: ${{ inputs.publish_debug_layers }}
        shell: bash
        run: |
          set -euo pipefail
          publish_start=$(date +%s)
          branch="${GITHUB_REF_NAME}"
          root="$GLM_OUTPUT_DIR"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$branch"
          mkdir -p static

          publish=(
            glm_conus_mosaic_5min.png glm_conus_mosaic_5min_metadata.json
            glm_conus_mosaic_30min.png glm_conus_mosaic_30min_metadata.json
            glm_conus_mosaic_60min.png glm_conus_mosaic_60min_metadata.json
            glm_convective_trend_15min_metadata.json
            glm_mosaic_manifest.json glm_mosaic_summary.csv
          )
          debug_publish=(
            glm_g18_fed_5min.png glm_g18_fed_5min_metadata.json
            glm_g18_fed_30min.png glm_g18_fed_30min_metadata.json
            glm_g18_fed_60min.png glm_g18_fed_60min_metadata.json
            glm_g19_fed_5min.png glm_g19_fed_5min_metadata.json
            glm_g19_fed_30min.png glm_g19_fed_30min_metadata.json
            glm_g19_fed_60min.png glm_g19_fed_60min_metadata.json
            glm_mosaic_source_ownership.png glm_mosaic_source_ownership_metadata.json
          )
          if [[ "${PUBLISH_DEBUG_LAYERS:-false}" == 'true' ]]; then
            publish+=("${debug_publish[@]}")
          else
            for file in "${debug_publish[@]}"; do
              git rm -f --ignore-unmatch "static/$file"
            done
          fi

          for file in "${publish[@]}"; do
            cp -f "$root/$file" "static/$file"
          done
          printf 'static/%s\n' "${publish[@]}" | xargs git add --

          if git diff --cached --quiet; then
            echo 'No GLM product changes to commit.'
            elapsed=$(( $(date +%s) - publish_start ))
            printf 'publish_seconds=%s\n' "$elapsed" >> "$RUNNER_TEMP/glm_workflow_timings.env"
            exit 0
          fi
          valid_end=$(python -c "import json; print(json.load(open('$root/glm_mosaic_manifest.json'))['window_end_utc'])")
          git commit -m "Update GOES GLM mosaic through ${valid_end}"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              elapsed=$(( $(date +%s) - publish_start ))
              printf 'publish_seconds=%s\n' "$elapsed" >> "$RUNNER_TEMP/glm_workflow_timings.env"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo 'GLM push failed after three attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
            git pull --rebase origin "$branch"
          done

      - name: Write workflow summary
        if: ${{ always() && hashFiles('glm_operational_staging/glm_mosaic_manifest.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          m = json.loads(Path('glm_operational_staging/glm_mosaic_manifest.json').read_text())
          cache = m.get('incremental_cache') or {}
          timing = m.get('timing_seconds') or {}
          workflow = {}
          timing_file = Path(os.environ['RUNNER_TEMP']) / 'glm_workflow_timings.env'
          if timing_file.exists():
              for line in timing_file.read_text().splitlines():
                  if '=' in line:
                      key, value = line.split('=', 1)
                      workflow[key] = value

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## GOES GLM Operational Run\n\n')
              f.write('- Workflow architecture: `stateless_per_run`\n')
              f.write(f"- Valid through: `{m.get('window_end_utc')}`\n")
              f.write(f"- Mode: `{m.get('execution_mode')}`\n")
              f.write(f"- Run-local cache hits: **{cache.get('cache_hits_this_run')}**\n")
              f.write(f"- New slots built: **{cache.get('new_slots_built_this_run')}**\n")
              for key, value in timing.items():
                  f.write(f'- Python {key}: {value} seconds\n')
              if 'dependency_install_seconds' in workflow:
                  f.write(f"- Dependency installation: **{workflow['dependency_install_seconds']} seconds**\n")
              if 'publish_seconds' in workflow:
                  f.write(f"- Git publication: **{workflow['publish_seconds']} seconds**\n")
          PY
