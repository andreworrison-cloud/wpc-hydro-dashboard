name: Update GOES GLM Controlled Mosaic

on:
  workflow_dispatch:
    inputs:
      analysis_time:
        description: Optional UTC end time; leave blank for newest synchronized data
        required: false
        default: ''
        type: string
      lookback_minutes:
        description: Minutes to search backward for a synchronized GOES-18/GOES-19 window
        required: false
        default: '180'
        type: string
      minimum_completeness:
        description: Minimum required LCFA file fraction for every satellite and time window
        required: false
        default: '0.80'
        type: string
      maximum_latency_minutes:
        description: Maximum age allowed for an automatically selected real-time end time
        required: false
        default: '45'
        type: string
      publish_debug_layers:
        description: Publish source ownership and separate GOES-18/GOES-19 reference layers
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-goes-glm-controlled-mosaic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            boto3 \
            botocore \
            'numpy<3' \
            xarray \
            netCDF4 \
            rasterio \
            Pillow

      - name: Validate controlled-mosaic science logic
        run: python fetch_glm_mosaic.py --self-test

      - name: Generate dashboard-ready GLM products
        env:
          ANALYSIS_TIME: ${{ inputs.analysis_time }}
          LOOKBACK_MINUTES: ${{ inputs.lookback_minutes }}
          MINIMUM_COMPLETENESS: ${{ inputs.minimum_completeness }}
          MAXIMUM_LATENCY_MINUTES: ${{ inputs.maximum_latency_minutes }}
          PUBLISH_DEBUG_LAYERS: ${{ inputs.publish_debug_layers }}
        run: |
          DEBUG_FLAG='--publish-debug-layers'
          if [[ "${PUBLISH_DEBUG_LAYERS}" == 'false' ]]; then
            DEBUG_FLAG='--no-publish-debug-layers'
          fi

          python fetch_glm_mosaic.py \
            --analysis-time "${ANALYSIS_TIME}" \
            --lookback-minutes "${LOOKBACK_MINUTES}" \
            --minimum-completeness "${MINIMUM_COMPLETENESS}" \
            --maximum-latency-minutes "${MAXIMUM_LATENCY_MINUTES}" \
            "${DEBUG_FLAG}" \
            --output-dir glm_operational_staging

      - name: Validate complete GLM publication package
        env:
          MINIMUM_COMPLETENESS: ${{ inputs.minimum_completeness }}
          PUBLISH_DEBUG_LAYERS: ${{ inputs.publish_debug_layers }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from PIL import Image

          root = Path('glm_operational_staging')
          minimum = float(os.environ.get('MINIMUM_COMPLETENESS') or 0.80)
          debug = (os.environ.get('PUBLISH_DEBUG_LAYERS') or 'true').lower() != 'false'

          main_stems = [
              'glm_conus_mosaic_5min',
              'glm_conus_mosaic_30min',
              'glm_conus_mosaic_60min',
          ]
          debug_stems = [
              'glm_g18_fed_5min', 'glm_g18_fed_30min', 'glm_g18_fed_60min',
              'glm_g19_fed_5min', 'glm_g19_fed_30min', 'glm_g19_fed_60min',
          ] if debug else []

          expected = {'glm_mosaic_manifest.json', 'glm_mosaic_summary.csv'}
          for stem in main_stems + debug_stems:
              expected.update({f'{stem}.png', f'{stem}_metadata.json'})
          if debug:
              expected.update({
                  'glm_mosaic_source_ownership.png',
                  'glm_mosaic_source_ownership_metadata.json',
              })

          missing = sorted(name for name in expected if not (root / name).is_file())
          if missing:
              raise SystemExit(f'Missing GLM publication files: {missing}')

          windows = {}
          for stem in main_stems:
              metadata = json.loads((root / f'{stem}_metadata.json').read_text())
              if metadata.get('metadata_mode') != 'glm_dashboard_v1':
                  raise SystemExit(f'{stem}: invalid metadata_mode')
              if metadata.get('product_role') != 'controlled_mosaic':
                  raise SystemExit(f'{stem}: invalid product_role')
              method = metadata.get('mosaic_method') or {}
              if any(method.get(key) is not False for key in (
                  'summation', 'averaging', 'blending', 'secondary_source_gap_fill'
              )):
                  raise SystemExit(f'{stem}: controlled mosaic safeguards failed')
              grid = metadata.get('grid') or {}
              if str(grid.get('image_crs', '')).upper() != 'EPSG:3857':
                  raise SystemExit(f'{stem}: PNG is not EPSG:3857')
              bounds = grid.get('leaflet_bounds')
              if not isinstance(bounds, list) or len(bounds) != 2:
                  raise SystemExit(f'{stem}: invalid Leaflet bounds')
              for satellite in ('G18', 'G19'):
                  stats = (metadata.get('satellite_inputs') or {}).get(satellite) or {}
                  if float(stats.get('completeness_fraction', 0.0)) < minimum:
                      raise SystemExit(f'{stem}: {satellite} completeness below threshold')
              windows[metadata['window_minutes']] = metadata['window_end_utc']

              image = Image.open(root / f'{stem}.png').convert('RGBA')
              alpha = image.getchannel('A')
              if image.width < 1000 or image.height < 500 or alpha.getextrema()[1] == 0:
                  raise SystemExit(f'{stem}: empty or implausibly small PNG')

          if len(set(windows.values())) != 1:
              raise SystemExit(f'Mosaic windows are not synchronized: {windows}')

          manifest = json.loads((root / 'glm_mosaic_manifest.json').read_text())
          if manifest.get('window_end_utc') != next(iter(windows.values())):
              raise SystemExit('Manifest window does not match mosaic metadata')

          print(f'Validated {len(expected)} GLM publication files at {next(iter(windows.values()))}.')
          PY

      - name: Upload GLM operational artifact
        uses: actions/upload-artifact@v7
        with:
          name: goes-glm-controlled-mosaic-operational
          path: glm_operational_staging/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publish products and push with retry
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git pull --rebase origin "${branch}"
          mkdir -p static
          cp -f glm_operational_staging/glm_* static/

          git add \
            static/glm_*.png \
            static/glm_*_metadata.json \
            static/glm_mosaic_manifest.json \
            static/glm_mosaic_summary.csv

          if git diff --cached --quiet; then
            echo 'No GLM product changes to commit.'
            exit 0
          fi

          valid_end=$(python - <<'PY'
          import json
          print(json.load(open('glm_operational_staging/glm_mosaic_manifest.json'))['window_end_utc'])
          PY
          )
          git commit -m "Update GOES GLM mosaic through ${valid_end}"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo 'GLM push failed after three attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
            git pull --rebase origin "${branch}"
          done
