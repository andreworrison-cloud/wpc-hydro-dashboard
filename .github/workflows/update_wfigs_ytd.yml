name: Update WFIGS Year-To-Date Wildfire Perimeters

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the WFIGS source edit time has not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wfigs-data-publish
  cancel-in-progress: false

jobs:
  update-ytd:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out dashboard code
        uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 1
          fetch-tags: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install WFIGS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'requests>=2.32,<3' 'shapely>=2.0,<3'

      - name: Prepare rolling wfigs-data worktree
        shell: bash
        run: |
          set -euo pipefail
          git -C repo fetch --no-tags origin wfigs-data:refs/remotes/origin/wfigs-data || true
          if git -C repo show-ref --verify --quiet refs/remotes/origin/wfigs-data; then
            git -C repo worktree add --detach ../wfigs-data refs/remotes/origin/wfigs-data
          else
            git -C repo worktree add --detach ../wfigs-data HEAD
            (
              cd wfigs-data
              git switch --orphan wfigs-data
              git rm -rf . >/dev/null 2>&1 || true
              find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              printf '%s\n' \
                '# WFIGS rolling dashboard data' \
                '' \
                'This branch contains generated NIFC/WFIGS wildfire-perimeter data for the' \
                'WPC Real-Time Hydrometeorological Dashboard. It is maintained by GitHub' \
                'Actions and is intentionally separate from the dashboard code branch.' \
                > README.md
            )
          fi
          mkdir -p wfigs-data/static/wfigs

      - name: Build WFIGS YTD delivery
        id: build
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          FORCE_ARGS=()
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            FORCE_ARGS+=(--force)
          fi
          python fetch_wfigs_operational.py \
            --mode ytd \
            --output-root _wfigs_build \
            --existing-root ../wfigs-data/static/wfigs \
            "${FORCE_ARGS[@]}"

      - name: Validate generated YTD delivery
        if: steps.build.outputs.changed == 'true'
        working-directory: repo
        run: |
          python tools/validate_wfigs_phase2.py \
            --mode ytd \
            --data-root _wfigs_build

      - name: Validate CONUS seasonal wildfire activity
        if: steps.build.outputs.changed == 'true'
        working-directory: repo
        run: |
          python tools/validate_wfigs_trends.py \
            --current _wfigs_build/ytd/seasonal_activity.json

      - name: Publish YTD chunks to wfigs-data
        if: steps.build.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wfigs-data/static/wfigs/ytd
          rsync -a --delete repo/_wfigs_build/ytd/ wfigs-data/static/wfigs/ytd/
          cd wfigs-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md static/wfigs/ytd
          if git diff --cached --quiet; then
            echo "Generated YTD files are byte-identical; no commit required."
            exit 0
          fi
          git commit -m "Update WFIGS YTD wildfire perimeters"
          git push origin HEAD:wfigs-data

      - name: Upload YTD build manifest
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wfigs-ytd-manifest
          path: |
            repo/_wfigs_build/ytd/manifest.json
            repo/_wfigs_build/ytd/seasonal_activity.json
          if-no-files-found: error
          retention-days: 14
